services:
  db:
    image: postgres:16-alpine
    container_name: nutrilens-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nutrilens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-nutrilens_db}
    # Security: In production, PostgreSQL stays on the private network (nutrilens-net).
    # For local debugging, port mapping is restricted strictly to host loopback (127.0.0.1).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutrilens_user} -d ${POSTGRES_DB:-nutrilens_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nutrilens-net

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutrilens-migration
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-nutrilens_user}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-nutrilens_db}}
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    networks:
      - nutrilens-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutrilens-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-nutrilens_user}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-nutrilens_db}}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RATE_LIMIT_ANALYZE_PER_MINUTE: ${RATE_LIMIT_ANALYZE_PER_MINUTE:-15}
    # Security: External web traffic must enter via Nginx reverse proxy on frontend service.
    # Backend direct port is bound strictly to host loopback (127.0.0.1) for local inspection/OpenAPI docs.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./data/nutrition:/app/data/nutrition
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nutrilens-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nutrilens-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - nutrilens-net

networks:
  nutrilens-net:
    driver: bridge

volumes:
  postgres_data:
