name: NutriLens CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests & Database Migrations (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nutrilens_ci_user
          POSTGRES_PASSWORD: nutrilens_ci_password
          POSTGRES_DB: nutrilens_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install system dependencies for Pillow and PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify migrations against SQLite from scratch
        env:
          DATABASE_URL: sqlite:///./ci_fresh_sqlite.db
        run: |
          alembic -c backend/alembic.ini upgrade head

      - name: Verify migrations against PostgreSQL 16 container from scratch
        env:
          DATABASE_URL: postgresql://nutrilens_ci_user:nutrilens_ci_password@localhost:5432/nutrilens_ci_db
        run: |
          alembic -c backend/alembic.ini upgrade head

      - name: Run backend pytest suite
        env:
          AI_PROVIDER: placeholder
          ENVIRONMENT: testing
          RATE_LIMIT_ANALYZE_PER_MINUTE: 100
        run: |
          pytest backend/tests -v --tb=short

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build
