services:
  db:
    image: postgres:16-alpine
    container_name: nutrilens-db
    restart: always
    environment:
      POSTGRES_USER: nutrilens_user
      POSTGRES_PASSWORD: nutrilens_password
      POSTGRES_DB: nutrilens_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrilens_user -d nutrilens_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutrilens-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nutrilens_user:nutrilens_password@db:5432/nutrilens_db
      CORS_ORIGINS: "http://localhost:5173,http://localhost:80,http://localhost"
      AI_PROVIDER: placeholder
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./data/nutrition:/app/data/nutrition

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nutrilens-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
