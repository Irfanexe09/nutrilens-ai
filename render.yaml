# ========================================================
# NutriLens — Render Infrastructure Blueprint Specification
# ========================================================
# Deploys the NutriLens FastAPI backend on Render's Free tier.
# Connects to an external free-tier managed PostgreSQL instance (e.g. Neon).
#
# Documentation: https://render.com/docs/blueprint-spec
# ========================================================

services:
  - type: web
    name: nutrilens-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    preDeployCommand: python scripts/run_staging_migrations.py
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOW_PLACEHOLDER_AI
        value: false
      - key: RATE_LIMIT_ANALYZE_PER_MINUTE
        value: 15
      - key: MAX_UPLOAD_SIZE_BYTES
        value: 10485760
