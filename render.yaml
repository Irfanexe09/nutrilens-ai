# ========================================================
# NutriLens — Render Infrastructure Blueprint Specification
# ========================================================
# Deploys the NutriLens FastAPI backend on Render's Free tier.
# Connects to an external free-tier managed PostgreSQL instance (e.g. Neon).
#
# Documentation: https://render.com/docs/blueprint-spec
# ========================================================

services:
  - type: web
    name: nutrilens-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    # Note: Render Free plans do not support preDeployCommand.
    # Migrations execute safely on container startup via backend/scripts/start.sh
    # before FastAPI accepts traffic.
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOW_PLACEHOLDER_AI
        value: false
      - key: RATE_LIMIT_ANALYZE_PER_MINUTE
        value: 15
      - key: MAX_UPLOAD_SIZE_BYTES
        value: 10485760
      - key: AI_TIMEOUT_SECONDS
        value: 30.0
      - key: AI_PER_ATTEMPT_TIMEOUT_SECONDS
        value: 12.0

